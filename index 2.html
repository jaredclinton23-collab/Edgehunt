<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090e"><title>EdgeHunt — Hunt the edge</title><style>
:root{--bg:#07090e;--p:#11151e;--b:#282e3a;--t:#f7f8fb;--m:#929aaa;--a:#7c5cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#241a50,transparent 35%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px 16px 60px}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900}.logo span{color:var(--a)}.tag{font-size:10px;color:var(--m);border:1px solid var(--b);padding:7px 10px;border-radius:99px}.nav,.chips{display:flex;gap:8px;overflow:auto;margin:20px 0 15px}.nav button,.chips button{background:#141820;color:#b9c0cb;border:1px solid var(--b);border-radius:99px;padding:10px 15px;white-space:nowrap}.nav button.active,.chips button.active{background:var(--a);color:#fff;border-color:var(--a)}.hero{padding:24px;border-radius:23px;border:1px solid #382d64;background:linear-gradient(135deg,#211644,#111720);margin-bottom:22px}.ey{color:#b3a7ff;font-size:12px;font-weight:800}.hero h1{font-size:clamp(31px,5vw,52px);line-height:1;margin:8px 0}.hero p{color:#a5adba;max-width:650px;line-height:1.5}.minirow{display:flex;gap:8px;flex-wrap:wrap}.mini{background:#090c13aa;border:1px solid #43366d;border-radius:12px;padding:9px 12px;font-size:11px}.mini b{display:block;font-size:17px;color:#fff}.headrow{display:flex;justify-content:space-between;align-items:end;margin:20px 0 10px}.muted{color:var(--m);font-size:13px}.search{width:100%;background:var(--p);border:1px solid var(--b);border-radius:12px;color:#fff;padding:13px;margin-bottom:12px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:13px}.card{background:linear-gradient(180deg,#121720,#0f131b);border:1px solid var(--b);border-radius:18px;padding:16px}.top{display:flex;justify-content:space-between;gap:10px}.player{font-size:18px;font-weight:850}.prop{font-size:13px;color:#adb5c2;margin-top:3px}.match{font-size:11px;color:#6f7888;margin-top:7px}.score{text-align:right;font-size:24px;font-weight:900}.score small{display:block;font-size:9px;color:var(--m)}.bar{height:6px;background:#292f39;border-radius:99px;margin:13px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6851ff,#9a87ff);border-radius:99px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:10px;color:var(--m)}.stats b{display:block;color:#fff;font-size:14px;margin-top:3px}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}.book{background:#0a0d13;border:1px solid var(--b);border-radius:10px;padding:8px 3px;text-align:center;color:#8992a2;font-size:9px}.book b{display:block;color:#fff;font-size:12px;margin-top:3px}.book.best{border-color:#6653cc;background:#141128}.book.best:after{content:"BEST";display:block;color:#a99cff;font-size:7px}.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:800}.btn.alt{background:#191e28;border:1px solid var(--b)}.empty{text-align:center;color:var(--m);padding:45px;border:1px dashed var(--b);border-radius:18px}.disc{font-size:10px;color:#687181;line-height:1.45;margin-top:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}} 
</style></head><body><div class="wrap"><header class="head"><div class="logo">Edge<span>Hunt</span></div><div class="tag">LIVE NFL • ODDS API</div></header><nav class="nav"><button class="active" data-page="home">🔥 Best Bets</button><button data-page="props">🎯 Prop Board</button><button data-page="long">💰 Longshots</button><button data-page="slip">🧾 My Slip <span id="count"></span></button></nav><main id="app"></main><div id="liveStatus" class="disc" style="margin-top:12px">Connecting to live NFL odds…</div><div class="disc">Demo lines and projections are illustrative only, not live sportsbook odds. EdgeHunt does not guarantee results.</div></div>
<script>
const DEMO=[
["Puka Nacua","LAR vs SF","Over 74.5 Receiving Yards",87,"7/10","91.2","+16.7",["74.5","75.5","73.5","73.5"],"best"],
["Kyren Williams","LAR vs SF","Over 58.5 Rushing Yards",82,"7/10","71.4","+12.9",["58.5","60.5","57.5","58.5"],"best"],
["Cooper Kupp","LAR vs SF","Over 5.5 Receptions",79,"7/10","6.3","+0.8",["5.5","5.5","5.5","5.5"],"best"],
["Matthew Stafford","LAR vs SF","Over 1.5 Passing TDs",76,"6/10","2.1","+0.6",["1.5","1.5","1.5","1.5"],"best"],
["Deebo Samuel","SF vs LAR","Over 48.5 Receiving Yards",74,"6/10","61.0","+12.5",["48.5","50.5","48.5","49.5"],"best"],
["Brock Purdy","SF vs LAR","Over 247.5 Passing Yards",71,"6/10","263","+15.5",["247.5","249.5","247.5","247.5"],"best"],
["Davante Adams","LAR vs SF","Anytime TD",64,"6/10","0.8 TD","High variance",["Yes","Yes","+105","+100"],"long"],
["Christian McCaffrey","SF vs LAR","2+ Touchdowns",52,"3/10","0.9 TD","Longshot",["Yes","Yes","+350","+340"],"long"]
];
const labels=["PrizePicks","Underdog","DraftKings","FanDuel"];
let P=DEMO,page="home",slip=[],q="",live=false,lastFetch=null;
const app=document.getElementById("app"),count=document.getElementById("count"),status=document.getElementById("liveStatus");
function marketName(m){return ({player_pass_yds:'Passing Yards',player_pass_tds:'Passing TDs',player_rush_yds:'Rushing Yards',player_receptions:'Receptions',player_reception_yds:'Receiving Yards',player_rush_reception_yds:'Rush + Receiving Yards',player_pass_completions:'Pass Completions',player_rush_attempts:'Rush Attempts',player_reception_tds:'Receiving TDs',player_rush_tds:'Rushing TDs'})[m]||m.replaceAll('_',' ')}
function makeLiveProps(rows){
  const groups=new Map();
  for(const r of rows){
    const k=`${r.eventId}|${r.market}|${r.player}|${r.point}`;
    if(!groups.has(k)) groups.set(k,{r,books:{}});
    groups.get(k).books[r.bookmaker]=r;
  }
  return [...groups.values()].map(g=>{
    const r=g.r; const books=g.books;
    const vals=[books.prizepicks?.point,books.underdog?.point,books.draftkings?.point,books.fanduel?.point];
    const available=Object.values(books);
    const prices=available.map(x=>x.price).filter(x=>typeof x==='number');
    const edgeScore=Math.max(50,Math.min(96,Math.round(68+(available.length*4)+(prices.length?Math.max(...prices)>0?3:0:0))));
    return [r.player,`${r.awayTeam} @ ${r.homeTeam}`,`${r.side} ${r.point} ${marketName(r.market)}`,edgeScore,'Live','—','Market',vals.map(v=>v==null?'—':String(v)), 'best',r.market,r.eventId];
  });
}
function card(x){let i=P.indexOf(x);return `<article class="card"><div class="top"><div><div class="player">${x[0]}</div><div class="prop">${x[2]}</div><div class="match">${x[1]}</div></div><div class="score">${x[3]}<small>EDGE SCORE</small></div></div><div class="bar"><i style="width:${x[3]}%"></i></div><div class="stats"><div>LAST 10<b>${x[4]}</b></div><div>PROJECTION<b>${x[5]}</b></div><div>MODEL EDGE<b>${x[6]}</b></div></div><div class="books">${x[7].map((v,n)=>`<div class="book ${v!=='—'&&n===2?'best':''}">${labels[n]}<b>${v}</b></div>`).join("")}</div><button class="btn" data-i="${i}">${slip.includes(i)?"Remove from Slip":"Add to Slip"}</button></article>`}
function show(){
 count.textContent=slip.length?`(${slip.length})`:"";
 if(page==="home")app.innerHTML=`<section class="hero"><div class="ey">🔥 EDGEHUNT INTELLIGENCE</div><h1>Hunt the edge.<br>Find the play.</h1><p>Live NFL player props from The Odds API, normalized across available sportsbooks and refreshed automatically.</p><div class="minirow"><div class="mini"><b>${P.filter(x=>x[8]==="best").length}</b>Live props</div><div class="mini"><b>60s</b>Refresh target</div><div class="mini"><b>4+</b>Books</div></div></section><div class="headrow"><h2>Top Bets</h2><span class="muted">${live?'Live market data':'Demo data'}</span></div><div class="grid">${P.filter(x=>x[8]==="best").slice(0,12).map(card).join("")}</div>`;
 if(page==="props")app.innerHTML=`<div class="headrow"><div><h2>Prop Board</h2><span class="muted">Search and compare live NFL props.</span></div></div><input id="q" class="search" placeholder="Search player, prop or matchup" value="${q}"><div class="grid">${P.filter(x=>(x[0]+" "+x[2]+" "+x[1]).toLowerCase().includes(q.toLowerCase())).map(card).join("")||'<div class="empty">No props found.</div>'}</div>`;
 if(page==="long")app.innerHTML=`<section class="hero"><div class="ey">💰 LONGSHOT HUNTER</div><h1>Hunt the big ones.</h1><p>Higher-variance plays with larger potential payouts.</p></section><div class="grid">${P.filter(x=>x[8]==="long").map(card).join("")}</div>`;
 if(page==="slip")app.innerHTML=`<div class="headrow"><div><h2>My Slip</h2><span class="muted">${slip.length} selection${slip.length===1?"":"s"}</span></div></div>${slip.length?`<div class="grid">${slip.map(i=>card(P[i])).join("")}</div><button class="btn alt" id="clear">Clear Slip</button>`:'<div class="empty">Your slip is empty.<br><br>Add a play from the Prop Board.</div>'}`;
 document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let i=+b.dataset.i;slip.includes(i)?slip=slip.filter(v=>v!==i):slip.push(i);show()});
 document.getElementById("q")?.addEventListener("input",e=>{q=e.target.value;show()});
 document.getElementById("clear")?.addEventListener("click",()=>{slip=[];show()});
}
async function loadLive(){
 try{
  const r=await fetch('/api/nfl-props',{cache:'no-store'}); const data=await r.json();
  if(!r.ok) throw new Error(data.error||'Live feed error');
  if(data.props?.length){P=makeLiveProps(data.props);live=true;lastFetch=new Date(data.fetchedAt);status.textContent=`🟢 LIVE NFL ODDS • Last checked ${lastFetch.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})} • Auto-refreshing every 60 seconds`;} else {status.textContent='🟡 No current NFL player props returned. Showing demo data.';}
 }catch(e){console.error(e);status.textContent='🟡 Live feed unavailable right now. Showing demo data.';P=DEMO;live=false;}
 show();
}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-page]").forEach(x=>x.classList.remove("active"));b.classList.add("active");page=b.dataset.page;show()});
show();loadLive();setInterval(loadLive,60000);
</script></body></html>
