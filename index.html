<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EdgeHunt">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#07090e">
<title>EdgeHunt — Hunt the edge</title>
<style>
:root{--bg:#07090e;--p:#11151e;--b:#282e3a;--t:#f7f8fb;--m:#929aaa;--a:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% -10%,#241a50,transparent 35%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:20px 16px 60px}
.head{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900}.logo span{color:var(--a)}
.tag{font-size:10px;color:var(--m);border:1px solid var(--b);padding:7px 10px;border-radius:99px}
.nav{display:flex;gap:8px;overflow:auto;margin:20px 0 15px}
.nav button{background:#141820;color:#b9c0cb;border:1px solid var(--b);border-radius:99px;padding:10px 15px;white-space:nowrap}
.nav button.active{background:var(--a);color:#fff;border-color:var(--a)}
.hero{padding:24px;border-radius:23px;border:1px solid #382d64;background:linear-gradient(135deg,#211644,#111720);margin-bottom:22px}
.ey{color:#b3a7ff;font-size:12px;font-weight:800}
.hero h1{font-size:clamp(31px,5vw,52px);line-height:1;margin:8px 0}
.hero p{color:#a5adba;max-width:650px;line-height:1.5}
.minirow{display:flex;gap:8px;flex-wrap:wrap}
.mini{background:#090c13aa;border:1px solid #43366d;border-radius:12px;padding:9px 12px;font-size:11px}
.mini b{display:block;font-size:17px;color:#fff}
.headrow{display:flex;justify-content:space-between;align-items:end;margin:20px 0 10px}
.muted{color:var(--m);font-size:13px}
.search{width:100%;background:var(--p);border:1px solid var(--b);border-radius:12px;color:#fff;padding:13px;margin-bottom:12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:13px}
.card{background:linear-gradient(180deg,#121720,#0f131b);border:1px solid var(--b);border-radius:18px;padding:16px}
.top{display:flex;justify-content:space-between;gap:10px}
.player{font-size:18px;font-weight:850}
.prop{font-size:13px;color:#adb5c2;margin-top:3px}
.match{font-size:11px;color:#6f7888;margin-top:7px}
.score{text-align:right;font-size:24px;font-weight:900}
.score small{display:block;font-size:9px;color:var(--m)}
.bar{height:6px;background:#292f39;border-radius:99px;margin:13px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6851ff,#9a87ff);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:10px;color:var(--m)}
.stats b{display:block;color:#fff;font-size:14px;margin-top:3px}
.books{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}
.book{background:#0a0d13;border:1px solid var(--b);border-radius:10px;padding:8px 3px;text-align:center;color:#8992a2;font-size:9px}
.book b{display:block;color:#fff;font-size:12px;margin-top:3px}
.book.best{border-color:#6653cc;background:#141128}
.book.best:after{content:"BEST";display:block;color:#a99cff;font-size:7px}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:800}
.btn.alt{background:#191e28;border:1px solid var(--b)}
.empty{text-align:center;color:var(--m);padding:45px;border:1px dashed var(--b);border-radius:18px}
.disc{font-size:10px;color:#687181;line-height:1.45;margin-top:20px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>
<div class="wrap">

<header class="head">
<div class="logo">Edge<span>Hunt</span></div>
<div class="tag">LIVE NFL • ODDS API</div>
</header>

<nav class="nav">
<button class="active" data-page="home">🔥 Best Bets</button>
<button data-page="props">🎯 Prop Board</button>
<button data-page="long">💰 Longshots</button>
<button data-page="slip">🧾 My Slip <span id="count"></span></button>
</nav>

<main id="app"></main>

<div id="liveStatus" class="disc">Connecting to live NFL odds…</div>

<div class="disc">
EdgeHunt currently calculates an initial market-based edge from available sportsbook lines.
Historical player projections and back-tested model performance will be added as the analytics engine develops.
EdgeHunt does not guarantee results.
</div>

</div>

<script>
const labels=["PrizePicks","Underdog","DraftKings","FanDuel"];

const marketNames={
player_pass_yds:"Passing Yards",
player_pass_tds:"Passing TDs",
player_rush_yds:"Rushing Yards",
player_receptions:"Receptions",
player_reception_yds:"Receiving Yards",
player_rush_reception_yds:"Rush + Receiving Yards",
player_pass_completions:"Pass Completions",
player_rush_attempts:"Rush Attempts",
player_reception_tds:"Receiving TDs",
player_rush_tds:"Rushing TDs"
};

let P=[];
let page="home";
let slip=[];
let q="";
let live=false;

const app=document.getElementById("app");
const count=document.getElementById("count");
const status=document.getElementById("liveStatus");

function marketName(m){
return marketNames[m]||m.replaceAll("_"," ");
}

function calculateScore(bookCount,lineSpread,priceStrength){
let score=50;

score+=Math.min(bookCount*5,20);
score+=Math.min(lineSpread*2.5,15);
score+=Math.min(priceStrength,10);

return Math.max(50,Math.min(95,Math.round(score)));
}

function makeLiveProps(rows){

const groups=new Map();

for(const r of rows){

const key=[
r.eventId,
r.market,
r.player
].join("|");

if(!groups.has(key)){
groups.set(key,{
eventId:r.eventId,
player:r.player,
market:r.market,
homeTeam:r.homeTeam,
awayTeam:r.awayTeam,
books:{}
});
}

if(!groups.get(key).books[r.bookmaker]){
groups.get(key).books[r.bookmaker]=[];
}

groups.get(key).books[r.bookmaker].push(r);
}

const output=[];

for(const g of groups.values()){

const books={};

for(const [book,arr] of Object.entries(g.books)){

const over=arr.find(x=>x.side==="Over");
const under=arr.find(x=>x.side==="Under");

books[book]={
over:over||null,
under:under||null
};
}

const allOver=Object.values(books)
.map(x=>x.over?.point)
.filter(x=>typeof x==="number");

const allUnder=Object.values(books)
.map(x=>x.under?.point)
.filter(x=>typeof x==="number");

if(!allOver.length&&!allUnder.length)continue;

const median=(arr)=>{
const a=[...arr].sort((x,y)=>x-y);
const mid=Math.floor(a.length/2);
return a.length%2?a[mid]:(a[mid-1]+a[mid])/2;
};

const overLine=allOver.length?median(allOver):null;
const underLine=allUnder.length?median(allUnder):null;

let side="Over";
let line=overLine;

if(overLine===null){
side="Under";
line=underLine;
}

const relevant=side==="Over"?allOver:allUnder;

const bestLine=
side==="Over"
?Math.max(...relevant)
:Math.min(...relevant);

const worstLine=
side==="Over"
?Math.min(...relevant)
:Math.max(...relevant);

const spread=Math.abs(bestLine-worstLine);

const prices=Object.values(books)
.map(x=>(side==="Over"?x.over?.price:x.under?.price))
.filter(x=>typeof x==="number");

const priceStrength=
prices.length
?Math.min(
10,
Math.max(
0,
Math.max(...prices)>0
?Math.max(...prices)/100*5
:0
))
:0;

const score=calculateScore(
relevant.length,
spread,
priceStrength
);

const projection=
side==="Over"
?line+spread*.35
:line-spread*.35;

const edgePct=
line
?Math.abs((projection-line)/Math.abs(line))*100
:0;

const bookValues=labels.map(label=>{

const key={
PrizePicks:"prizepicks",
Underdog:"underdog",
DraftKings:"draftkings",
FanDuel:"fanduel"
}[label];

const item=books[key];

if(!item)return"—";

const selected=side==="Over"?item.over:item.under;

return selected?.point!=null
?String(selected.point)
:"—";
});

output.push({
player:g.player,
matchup:`${g.awayTeam} @ ${g.homeTeam}`,
market:g.market,
side,
line,
projection,
edgePct,
score,
bookValues,
spread,
bookCount:relevant.length,
eventId:g.eventId
});
}

return output.sort((a,b)=>b.score-a.score);
}

function card(x){

const i=P.indexOf(x);

return `
<article class="card">

<div class="top">

<div>
<div class="player">${x.player}</div>

<div class="prop">
${x.side} ${x.line} ${marketName(x.market)}
</div>

<div class="match">
${x.matchup}
</div>
</div>

<div class="score">
${x.score}
<small>EDGE SCORE</small>
</div>

</div>

<div class="bar">
<i style="width:${x.score}%"></i>
</div>

<div class="stats">

<div>
BOOKS
<b>${x.bookCount}</b>
</div>

<div>
PROJECTION
<b>${x.projection.toFixed(1)}</b>
</div>

<div>
MARKET EDGE
<b>+${x.edgePct.toFixed(1)}%</b>
</div>

</div>

<div class="books">

${x.bookValues.map((v,n)=>`

<div class="book ${v!=="—"&&v===(x.side==="Over"?String(Math.max(...x.bookValues.filter(z=>z!=="—").map(Number))):String(Math.min(...x.bookValues.filter(z=>z!=="—").map(Number))))?"best":""}">

${labels[n]}

<b>${v}</b>

</div>

`).join("")}

</div>

<button class="btn" data-i="${i}">
${slip.includes(i)?"Remove from Slip":"Add to Slip"}
</button>

</article>`;
}

function show(){

count.textContent=slip.length?`(${slip.length})`:"";

if(page==="home"){

const bets=P.slice(0,12);

app.innerHTML=`

<section class="hero">

<div class="ey">🔥 EDGEHUNT INTELLIGENCE</div>

<h1>Hunt the edge.<br>Find the play.</h1>

<p>
Live NFL player props ranked by sportsbook market strength.
</p>

<div class="minirow">

<div class="mini">
<b>${P.length}</b>
Live Props
</div>

<div class="mini">
<b>60s</b>
Refresh Target
</div>

<div class="mini">
<b>4+</b>
Books
</div>

</div>

</section>

<div class="headrow">
<h2>Top Bets</h2>
<span class="muted">${live?"Live market data":"Waiting for live data"}</span>
</div>

<div class="grid">

${bets.length
?bets.map(card).join("")
:`<div class="empty">
No current NFL player props are available right now.
<br><br>
EdgeHunt will automatically check again.
</div>`}

</div>
`;
}

if(page==="props"){

app.innerHTML=`

<div class="headrow">
<div>
<h2>Prop Board</h2>
<span class="muted">Search and compare live NFL props.</span>
</div>
</div>

<input
id="q"
class="search"
placeholder="Search player, prop or matchup"
value="${q}"
>

<div class="grid">

${P.filter(x=>
(x.player+" "+marketName(x.market)+" "+x.matchup)
.toLowerCase()
.includes(q.toLowerCase())
).map(card).join("")||`
<div class="empty">No props found.</div>
`}

</div>
`;
}

if(page==="long"){

app.innerHTML=`

<section class="hero">

<div class="ey">💰 LONGSHOT HUNTER</div>

<h1>Hunt the big ones.</h1>

<p>
High-variance player props with larger potential payouts.
</p>

</section>

<div class="grid">

${P
.filter(x=>x.score<65)
.slice(0,12)
.map(card)
.join("")||`
<div class="empty">
No longshot props are currently available.
</div>
`}

</div>
`;
}

if(page==="slip"){

app.innerHTML=`

<div class="headrow">

<div>
<h2>My Slip</h2>
<span class="muted">
${slip.length} selection${slip.length===1?"":"s"}
</span>
</div>

</div>

${slip.length
?`
<div class="grid">
${slip.map(i=>card(P[i])).join("")}
</div>

<button class="btn alt" id="clear">
Clear Slip
</button>
`
:`
<div class="empty">
Your slip is empty.
<br><br>
Add a play from the Prop Board.
</div>
`}
`;
}

document.querySelectorAll("[data-i]").forEach(b=>{
b.onclick=()=>{
const i=Number(b.dataset.i);

if(slip.includes(i)){
slip=slip.filter(v=>v!==i);
}else{
slip.push(i);
}

show();
};
});

document.getElementById("q")?.addEventListener("input",e=>{
q=e.target.value;
show();
});

document.getElementById("clear")?.addEventListener("click",()=>{
slip=[];
show();
});
}

async function loadLive(){

try{

const response=await fetch(
"/api/nfl-props",
{cache:"no-store"}
);

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"Live feed error");
}

if(data.props?.length){

P=makeLiveProps(data.props);

live=true;

status.textContent=
"🟢 LIVE NFL ODDS • Auto-refreshing every 60 seconds";

}else{

P=[];
live=false;

status.textContent=
"🟡 No current NFL player props available • Checking again in 60 seconds";
}

}catch(error){

console.error(error);

P=[];
live=false;

status.textContent=
"🔴 Live NFL feed unavailable • Checking again in 60 seconds";
}

show();
}

document.querySelectorAll("[data-page]").forEach(b=>{

b.onclick=()=>{

document
.querySelectorAll("[data-page]")
.forEach(x=>x.classList.remove("active"));

b.classList.add("active");

page=b.dataset.page;

show();

};

});

show();
loadLive();
setInterval(loadLive,60000);
</script>

</body>
</html>
