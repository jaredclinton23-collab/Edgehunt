<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>EdgeHunt — Find the Edge</title>
<style>
:root{--bg:#090b10;--panel:#131720;--border:#282e3a;--text:#f7f8fb;--muted:#929aaa;--accent:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:22px 18px 50px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:30px;font-weight:900}.logo span{color:var(--accent)}.badge{border:1px solid var(--border);padding:7px 10px;border-radius:999px;color:var(--muted);font-size:11px}
nav{display:flex;gap:8px;overflow:auto;margin:22px 0}nav button,.filter{border:1px solid var(--border);background:#141820;color:#b8bfcb;padding:10px 15px;border-radius:999px;white-space:nowrap;cursor:pointer}nav button.active,.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hero{padding:24px;border:1px solid #332b59;background:linear-gradient(135deg,#17132b,#121720);border-radius:22px;margin-bottom:24px}.eyebrow{color:#b0a4ff;font-weight:800;font-size:12px}.hero h1{font-size:clamp(30px,6vw,52px);margin:7px 0}.hero p{color:var(--muted);max-width:600px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px}.top{display:flex;justify-content:space-between;gap:12px}.player{font-size:19px;font-weight:850}.prop{color:#aeb6c3;font-size:14px;margin-top:3px}.score{text-align:right;font-size:22px;font-weight:900}.score small{display:block;color:var(--muted);font-size:9px}.bar{height:6px;background:#292f3a;border-radius:99px;margin:13px 0}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;color:var(--muted);font-size:11px}.stats b{display:block;color:#fff;font-size:14px;margin-top:3px}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}.book{background:#0d1016;border:1px solid var(--border);border-radius:10px;padding:8px 3px;text-align:center;color:var(--muted);font-size:9px}.book b{display:block;color:#fff;font-size:12px;margin-top:3px}.book.best{border-color:var(--accent)}.book.best:after{content:" BEST";color:#b0a4ff;font-size:8px}.btn{width:100%;margin-top:13px;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:600px){.wrap{padding:18px 14px 35px}.grid{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<header class="header"><div class="logo">Edge<span>Hunt</span></div><div class="badge">V1 • DEMO DATA</div></header>
<nav id="nav"><button class="active" data-page="home">Home</button><button data-page="props">Prop Board</button><button data-page="long">Longshots</button><button data-page="slip">My Slip <span id="slipCount"></span></button></nav>
<section id="app"></section>
</div>
<script>
const props=[
{name:"Puka Nacua",prop:"Over 74.5 Receiving Yards",score:87,hit:"7/10",proj:"91.2",edge:"+16.7",books:["74.5","75.5","73.5","73.5"],type:"best"},
{name:"Kyren Williams",prop:"Over 58.5 Rushing Yards",score:82,hit:"7/10",proj:"71.4",edge:"+12.9",books:["58.5","60.5","57.5","58.5"],type:"best"},
{name:"Cooper Kupp",prop:"Over 5.5 Receptions",score:79,hit:"7/10",proj:"6.3",edge:"+0.8",books:["5.5","5.5","5.5","5.5"],type:"best"},
{name:"Matthew Stafford",prop:"Over 1.5 Passing TDs",score:76,hit:"6/10",proj:"2.1",edge:"+0.6",books:["1.5","1.5","1.5","1.5"],type:"best"},
{name:"Deebo Samuel",prop:"Over 48.5 Receiving Yards",score:74,hit:"6/10",proj:"61.0",edge:"+12.5",books:["48.5","50.5","48.5","49.5"],type:"best"},
{name:"Brock Purdy",prop:"Over 247.5 Passing Yards",score:71,hit:"6/10",proj:"263",edge:"+15.5",books:["247.5","249.5","247.5","247.5"],type:"best"},
{name:"Davante Adams",prop:"Anytime TD",score:64,hit:"6/10",proj:"0.8 TD",edge:"High variance",books:["Yes","Yes","+105","+100"],type:"long"},
{name:"Christian McCaffrey",prop:"2+ Touchdowns",score:52,hit:"3/10",proj:"0.9 TD",edge:"Longshot",books:["Yes","Yes","+350","+340"],type:"long"}
];
let page="home",slip=[];
const app=document.getElementById("app"), count=document.getElementById("slipCount");
function card(x){
let labels=["PrizePicks","Underdog","DraftKings","FanDuel"];
return `<article class="card"><div class="top"><div><div class="player">${x.name}</div><div class="prop">${x.prop}</div></div><div class="score">${x.score}<small>EDGEHUNT</small></div></div><div class="bar"><i style="width:${x.score}%"></i></div><div class="stats"><div>L10 HIT<b>${x.hit}</b></div><div>PROJECTION<b>${x.proj}</b></div><div>MODEL EDGE<b>${x.edge}</b></div></div><div class="books">${x.books.map((v,i)=>`<div class="book ${i===2?'best':''}">${labels[i]}<b>${v}</b></div>`).join("")}</div><button class="btn" data-i="${props.indexOf(x)}">${slip.includes(props.indexOf(x))?"Remove from Slip":"Add to Slip"}</button></article>`;
}
function render(){
count.textContent=slip.length?`(${slip.length})`:"";
if(page==="home")app.innerHTML=`<div class="hero"><div class="eyebrow">🔥 EDGEHUNT MODEL</div><h1>Hunt the edge. Find the play.</h1><p>Compare prop lines across PrizePicks, Underdog, DraftKings and FanDuel, then rank plays by model confidence.</p></div><h2>Top Props</h2><div class="grid">${props.filter(x=>x.type==="best").slice(0,4).map(card).join("")}</div>`;
if(page==="props")app.innerHTML=`<h1>Prop Board</h1><p style="color:var(--muted)">All available demo props and sportsbook comparisons.</p><div class="grid">${props.map(card).join("")}</div>`;
if(page==="long")app.innerHTML=`<div class="hero"><div class="eyebrow">💰 LONGSHOT HUNTER</div><h1>Hunt the big ones.</h1><p>Higher-variance plays with bigger potential payouts. These are not guarantees.</p></div><div class="grid">${props.filter(x=>x.type==="long").map(card).join("")}</div>`;
if(page==="slip")app.innerHTML=`<h1>My Slip</h1><p style="color:var(--muted)">${slip.length} selected</p>${slip.length?`<div class="grid">${slip.map(i=>card(props[i])).join("")}</div><button class="btn" id="clear">Clear Slip</button>`:`<div class="empty">Your slip is empty.<br>Add props from the Prop Board.</div>`}`;
document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let i=+b.dataset.i;slip.includes(i)?slip=slip.filter(x=>x!==i):slip.push(i);render()});
document.getElementById("clear")?.addEventListener("click",()=>{slip=[];render()});
}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-page]").forEach(x=>x.classList.remove("active"));b.classList.add("active");page=b.dataset.page;render()});
render();
</script></body></html>
